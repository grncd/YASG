name: Bug Report
description: Create a report to help us improve YASG
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Please fill out this form completely. This information allows us to reproduce the error and fix it faster.**

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which operating system are you using?
      options:
        - Windows
        - Linux
        - Android
    validations:
      required: true

  - type: dropdown
    id: install_status
    attributes:
      label: Installation Status
      description: Is this a fresh install or an update?
      options:
        - First time installing YASG
        - Updated to a newer version
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Player Log
      description: |
        **This is required.** Please paste the contents of your log **right after the issue occurred and you closed your game.**
        
        **Where to find it:**
        - **Windows:** `%localappdata%low/YASG/YASG/Player.log`
        - **Linux:** `.config/unity3d/YASG/YASG/Player.log`
      placeholder: Paste the text from your Player.log file here (or drag and drop the file).
      render: shell
    validations:
      required: true

  - type: textarea
    id: cause
    attributes:
      label: What caused the issue?
      description: What were you doing when the bug happened? (Steps to reproduce)
      placeholder: |
        Example:
        1. Opened the main menu.
        2. Clicked 'Settings'.
        3. The game froze.
    validations:
      required: true
