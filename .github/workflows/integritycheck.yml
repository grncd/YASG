name: Integrity Test

on:
  workflow_dispatch:
  schedule:
    # 13:00 UTC = 10:00 AM UTC-3
    # 23:00 UTC = 08:00 PM UTC-3
    - cron: '0 13,23 * * *'

jobs:
  run-yasg:
    runs-on: self-hosted
    
    permissions:
      contents: read

    steps:
      - name: Clean Workspace
        shell: powershell
        run: |
          Write-Host "Cleaning workspace: $env:GITHUB_WORKSPACE"
          # Deletes all files and folders inside the work directory
          if (Test-Path "$env:GITHUB_WORKSPACE\*") {
              Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse | Remove-Item -Recurse -Force
              Write-Host "✅ Workspace cleaned."
          } else {
              Write-Host "Workspace already clean."
          }

      - name: Clean Registry
        shell: powershell
        run: |
          $registryPath = "HKCU:\SOFTWARE\YASG\YASG"
          if (Test-Path $registryPath) {
              Write-Host "Found existing registry key at $registryPath. Deleting..."
              Remove-Item -Path $registryPath -Recurse -Force
              Write-Host "✅ Registry cleared."
          } else {
              Write-Host "Registry key not found."
          }

      - name: Download Latest YASG Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          # Re-create downloads folder after cleaning
          New-Item -ItemType Directory -Force -Path "downloads"
          Write-Host "Fetching latest release from grncd/YASGsetuputilities..."
          gh release download --repo grncd/YASGsetuputilities --pattern "YASG_Windows.zip" --dir "downloads"
          Write-Host "Download complete."

      - name: Extract Game
        shell: powershell
        run: |
          Expand-Archive -Path "downloads\YASG_Windows.zip" -DestinationPath "game_dist" -Force
          Write-Host "Contents of game folder:"
          Get-ChildItem -Path "game_dist"
          
      - name: Run YASG.exe (Setup & Restart)
        shell: powershell
        run: |
          cd game_dist
          
          # --- Run 1: Setup Phase ---
          Write-Host "🚀 Launching YASG.exe [Run 1/2: Setup Phase]..."
          
          try {
            Start-Process -FilePath ".\YASG.exe" -ArgumentList "-batchmode", "-nographics" -Wait -NoNewWindow -ErrorAction Stop
            Write-Host "✅ Setup phase complete. Process exited."
          }
          catch {
            Write-Warning "Run 1 exited unexpectedly or threw an error."
          }

          Write-Host "Waiting 5 seconds for cleanup..."
          Start-Sleep -Seconds 5

          # --- Run 2: Verification Phase ---
          Write-Host "🚀 Launching YASG.exe [Run 2/2: Verification Phase]..."
          
          try {
            Start-Process -FilePath ".\YASG.exe" -ArgumentList "-batchmode", "-nographics" -Wait -NoNewWindow -ErrorAction Stop
            Write-Host "✅ Second run complete."
          }
          catch {
             Write-Warning "Run 2 exited unexpectedly."
          }

      - name: Verify Success
        shell: powershell
        run: |
          if (Test-Path "game_dist\success.txt") {
              Write-Host "✅ success.txt found! The test passed."
              Get-Content "game_dist\success.txt"
              exit 0
          } else {
              Write-Error "❌ success.txt was NOT found. The test failed."
              exit 1
          }
