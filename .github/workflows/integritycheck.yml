name: Integrity Test

#on:
  #workflow_dispatch:
  #push:
    #branches: [ "main" ]

jobs:
  run-yasg:
    runs-on: windows-latest
    
    # Permission needed to use the GitHub CLI (gh)
    permissions:
      contents: read

    steps:
      - name: Download Latest YASG Release
        shell: powershell
        env:
          # This token is automatically provided by GitHub Actions
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          Write-Host "Fetching latest release from grncd/YASGsetuputilities..."
          
          # Downloads 'YASG_Windows.zip' from the latest release of the specified repo
          gh release download --repo grncd/YASGsetuputilities --pattern "YASG_Windows.zip" --dir "downloads"
          
          Write-Host "Download complete."

      - name: Extract Game
        shell: powershell
        run: |
          # Extracts the zip to a folder named 'game_dist'
          Expand-Archive -Path "downloads\YASG_Windows.zip" -DestinationPath "game_dist"
          
          Write-Host "Contents of game folder:"
          Get-ChildItem -Path "game_dist"
          
      - name: Run YASG.exe and Wait
        shell: powershell
        run: |
          # Note: Adjust path if the zip contains a subfolder (e.g., game_dist/Build/YASG.exe)
          # For now, we assume YASG.exe is at the root of the zip.
          cd game_dist
          
          Write-Host "Starting YASG.exe in batchmode..."
          
          try {
            # -batchmode -nographics: Run without window/GPU (prevents crashes on VM)
            # -Wait: Pauses workflow until the game closes itself
            Start-Process -FilePath ".\YASG.exe" -ArgumentList "-batchmode", "-nographics" -Wait -NoNewWindow -ErrorAction Stop
          }
          catch {
            Write-Warning "Process exited. Checking for results..."
          }

      - name: Verify Success
        shell: powershell
        run: |
          cd game_dist
          
          if (Test-Path "success.txt") {
              Write-Host "✅ success.txt found! The test passed."
              Get-Content "success.txt"
              exit 0
          } else {
              Write-Error "❌ success.txt was NOT found. The test failed."
              exit 1
          }
